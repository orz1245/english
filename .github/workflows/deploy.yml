name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      init_d1_schema:
        description: '是否在部署前执行 D1 远程数据库建表脚本 (schema.sql)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy LinguaForge Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    # 说明：GitHub Actions 的 `if:` 表达式不支持 secrets 上下文（会导致整份 workflow
    # 校验失败、连 job 都不会创建），因此统一在这里转成 job 级 env 后再用 env.* 做条件判断。
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      DEFAULT_AI_API_KEY: ${{ secrets.DEFAULT_AI_API_KEY }}

    steps:
      - name: 1. 检出代码 (Checkout Repository)
        uses: actions/checkout@v4

      - name: 2. 配置 Node.js 环境 (Setup Node.js 20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. 安装项目依赖 (Install Dependencies)
        run: npm install

      - name: 4. 类型检查与构建前端静态资源 (Typecheck & Build Client Assets)
        run: |
          npm run typecheck
          npm run build

      - name: 5. 注入 D1 Database ID（若配置了 GitHub Secret）
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_D1_DATABASE_ID != ''
        run: |
          echo "检测到 CLOUDFLARE_D1_DATABASE_ID，正在注入 wrangler.toml..."
          sed -i "s/00000000-0000-0000-0000-000000000000/$CLOUDFLARE_D1_DATABASE_ID/g" wrangler.toml

      - name: 6. 执行 D1 数据库表结构初始化（可选）
        if: github.event_name == 'workflow_dispatch' && inputs.init_d1_schema == 'true'
        run: npx wrangler d1 execute linguaforge-db --remote --file=./schema.sql

      - name: 7. 部署至 Cloudflare Workers (Wrangler Deploy)
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: 8. 同步服务端默认 AI 密钥（若配置了 DEFAULT_AI_API_KEY Secret）
        if: github.event_name != 'pull_request' && env.DEFAULT_AI_API_KEY != ''
        run: echo "$DEFAULT_AI_API_KEY" | npx wrangler secret put DEFAULT_AI_API_KEY
